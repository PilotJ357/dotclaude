# Keeps the SHA pins in .github/workflows/ and the npm lockfile under review
# rather than letting them rot. Pinning without updates is its own risk.
#
# `cooldown` stops Dependabot proposing a version until it has been public for
# a set number of days. A compromised package is usually caught and unpublished
# within hours to days, so waiting removes the window in which a malicious
# release would be picked up. scripts/check-dep-age.mjs enforces the same floor
# against the lockfile, which also catches a manual `npm install`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    ignore:
      # js-yaml 5.x removed the default export, so it is a code change rather
      # than a version bump. The 4.x line is still maintained — 4.3.0 shipped
      # after 5.0.0 — so security fixes continue to arrive through patches,
      # which are not ignored here. Revisit deliberately once 5.x has settled.
      - dependency-name: js-yaml
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    cooldown:
      default-days: 7
