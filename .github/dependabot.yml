# Keeps the SHA pins in .github/workflows/ and the npm lockfile under review
# rather than letting them rot. Pinning without updates is its own risk.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    ignore:
      # js-yaml 5.x removed the default export, so it is a code change rather
      # than a version bump. The 4.x line is still maintained — 4.3.0 shipped
      # after 5.0.0 — so security fixes continue to arrive through patches,
      # which are not ignored here. Revisit deliberately once 5.x has settled.
      - dependency-name: js-yaml
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
